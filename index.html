<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Capsule photo</title>
  <meta name="theme-color" content="#7a1fb8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-white min-h-screen">
  <div class="floaters" aria-hidden="true"><span>🏸</span><span>✨</span><span>⚡</span><span>🏸</span><span>✨</span></div>
  <canvas id="confetti"></canvas>
  <div id="screenFlash" class="hidden"></div>
  <div id="toast" class="toast" role="status"></div>

  <!-- Barre admin -->
  <div id="adminBar" class="admin-bar hidden">
    <span id="lockState" class="font-semibold"></span>
    <button id="btnToPhoto" class="chip hidden">← Revenir en photographe</button>
    <button id="btnToGallery" class="chip hidden">🖼 Voir la galerie</button>
    <button id="holdBtn" class="hold"><span id="holdLabel"></span></button>
    <button id="btnLogout" class="chip">Quitter admin</button>
  </div>

  <main class="max-w-md mx-auto px-5 pt-6 pb-12">
    <header class="text-center mb-6">
      <img id="logoHeader" src="logo.png" alt="Logo du club" class="h-24 w-24 object-contain mx-auto mb-3 select-none logo-glow" onerror="this.style.display='none'">
      <h1 id="themeTitle" class="fluo-title pulse text-5xl leading-none"></h1>
      <p id="subtitle" class="mt-3 text-white/80"></p>
    </header>

    <!-- CAMÉRA -->
    <section id="viewCapture">
      <div class="cam-frame">
        <div class="cam-inner">
          <video id="video" playsinline muted autoplay></video>
          <button id="camStart" class="cam-start">📸 Ouvrir l'appareil photo</button>
          <div id="shutterFx" class="shutter-fx"></div>
        </div>
        <div class="cam-footer"><img id="footLogo" src="logo.png" alt="" onerror="this.style.display='none'"><span id="footTitle" class="fluo-title"></span></div>
      </div>
      <div class="cam-controls">
        <button id="btnFlash" class="round-btn hidden" aria-label="Flash">⚡<small id="flashLbl">Flash off</small></button>
        <button id="btnShot" class="shot" aria-label="Prendre la photo"></button>
        <button id="btnFlip" class="round-btn" aria-label="Changer de caméra">🔄<small>Caméra</small></button>
      </div>
      <label class="block mt-5">
        <input id="fileInput" type="file" accept="image/*" class="hidden">
        <span class="btn-ghost">🖼 Importer depuis ma galerie</span>
      </label>
      <p class="text-center text-sm text-white/70 mt-4">Ta photo est scellée dès qu'elle est prise : découverte demain !</p>
      <p id="sentCount" class="text-center text-sm mt-1 text-yellow-300 font-semibold"></p>
      <button id="btnInstall" class="btn-ghost hidden mt-4">📲 Ajouter l'appli à mon écran d'accueil</button>
    </section>

    <!-- GALERIE -->
    <section id="viewGallery" class="hidden">
      <p class="text-center text-white/80 mb-5">La capsule est ouverte ! Touche une photo pour l'agrandir et la télécharger.</p>
      <div id="grid" class="grid grid-cols-2 gap-3"></div>
      <p id="galleryEmpty" class="hidden text-center text-white/60 mt-6">Aucune photo pour le moment.</p>
    </section>

    <!-- Accès admin caché -->
    <section id="adminPanel" class="hidden panel mt-8">
      <h3 class="font-semibold mb-3">Mode admin</h3>
      <input id="adminPwd" type="password" placeholder="Mot de passe" class="w-full rounded-lg px-4 py-3 bg-white text-purple-950 mb-3">
      <button id="adminBtn" class="btn-ghost">Entrer</button>
    </section>
  </main>

  <div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4">
    <img id="lightboxImg" class="max-h-[75vh] max-w-full rounded shadow-2xl" alt="">
    <div class="flex flex-wrap justify-center gap-3 mt-4">
      <a id="lightboxDl" class="btn-main !w-auto px-6" download>⬇ Télécharger</a>
      <button id="lightboxDel" class="btn-danger hidden">🗑 Supprimer</button>
      <button id="lightboxClose" class="btn-ghost !w-auto px-6">Fermer</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
